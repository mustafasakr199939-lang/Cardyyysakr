<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090908"><meta name="description" content="مصطفى صقر | حلول الولاء الرقمية للمطاعم والكافيهات"><title>مصطفى صقر | بطاقة VIP الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#d6b66a;--pale:#f5e5ad;--muted:#aaa69b;--line:rgba(214,182,106,.24)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 16px 56px;color:#f6f2e8;font-family:Cairo,Tahoma,sans-serif;background:radial-gradient(ellipse at 50% 0%,rgba(128,94,37,.22),transparent 38rem),#090908;overflow-x:hidden}.page{width:min(100%,1120px);margin:auto}.card{--rx:0deg;--ry:0deg;--sx:50%;--sy:0%;position:relative;isolation:isolate;overflow:hidden;width:min(100%,520px);margin:auto;padding:34px 26px 26px;border:1px solid rgba(226,194,123,.36);border-radius:30px;text-align:center;background:linear-gradient(145deg,rgba(33,30,23,.94),rgba(13,13,12,.96) 58%,rgba(27,24,19,.9));box-shadow:0 32px 90px #0009,inset 0 1px #ffffff18;backdrop-filter:blur(20px);transform:perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .18s ease}.card:before{content:"";position:absolute;inset:-70%;z-index:-1;pointer-events:none;background:linear-gradient(115deg,transparent 43%,#ffffff08 47%,#ffe7ad24 50%,#ffffff08 53%,transparent 58%);animation:shine 7s ease-in-out infinite}.card:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(360px circle at var(--sx) var(--sy),#ffe2a01f,transparent 65%)}.eyebrow{color:var(--pale);font-size:11px;font-weight:700;letter-spacing:2px}.avatar{width:132px;height:132px;margin:22px auto 16px;padding:4px;border-radius:50%;background:conic-gradient(#fff1bd,#a57c35,#f8e6ab,#8b682d,#d6b66a,#fff1bd);box-shadow:0 0 0 7px #d6b66a12,0 0 38px #d6b66a55;animation:glow 4s infinite}.avatar-inner{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;border:3px solid #13120f;border-radius:50%;background:#17150f;color:var(--pale);font-size:36px;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 25%}h1{margin:0;color:var(--pale);font-size:clamp(29px,8vw,37px);font-weight:800}.title{margin:5px auto 0;color:#eee8d8;font-size:15px;font-weight:600;line-height:1.9}.company{display:inline-block;margin-top:12px;padding:3px 15px;border:1px solid var(--line);border-radius:99px;color:var(--gold);font-size:11px;letter-spacing:2px}.bio{margin:17px auto 21px;color:var(--muted);font-size:13px;line-height:2}.btn{min-height:49px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:15px;color:#f6f2e8;font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;background:#ffffff0a;transition:.2s}.btn:hover{transform:translateY(-2px);background:#d6b66a1c}.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.primary{width:100%;min-height:54px;border:0;color:#19140b;background:linear-gradient(110deg,#a77b32,#f3dfa1 52%,#c49a4d);font-size:15px}.contact{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 14px}.action{min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 4px;border:1px solid var(--line);border-radius:16px;color:#f0eadc;text-decoration:none;background:#ffffff09;transition:.2s}.action:hover{transform:translateY(-3px);color:var(--pale);border-color:#f5e5ad88}.action svg,.social svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.action span{font-size:11px}.share{width:100%}.socials{display:flex;justify-content:center;gap:10px;margin:20px 0 12px}.social{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--gold)}.info{margin-top:17px;padding-top:13px;border-top:1px solid #ffffff12;color:var(--muted);font-size:11px;line-height:2}.info p{margin:2px}.ltr{direction:ltr;display:inline-block}.section{margin-top:52px}.section h2{margin:0 0 7px;color:var(--pale);text-align:center;font-size:clamp(23px,6vw,30px)}.lead{margin:0 auto 24px;color:var(--muted);text-align:center;font-size:13px}.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.project{overflow:hidden;border:1px solid var(--line);border-radius:21px;background:linear-gradient(150deg,#1d1b16dd,#0f0f0de8);transition:.25s}.project:hover{transform:translateY(-5px);border-color:#f5e5ad88}.project-image{height:190px;overflow:hidden;background:#18150e}.project-image img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.project:hover img{transform:scale(1.05)}.project-content{padding:17px}.kicker{color:var(--gold);font-size:10px;font-weight:700}.project h3{margin:5px 0 7px;font-size:16px;line-height:1.7}.project p{min-height:54px;margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.8}.demo{width:100%;min-height:43px;border-radius:12px;color:#171109;background:linear-gradient(110deg,#bc9147,#f2dfa5);font-size:12px}.demo[aria-disabled=true]{color:#d1c5a5;background:#d6b66a1a;border-style:dashed}.note{display:block;margin-top:7px;color:#8e8879;text-align:center;font-size:10px}.toast{position:fixed;z-index:5;right:50%;bottom:22px;max-width:90%;padding:11px 20px;border-radius:14px;color:#171109;background:var(--pale);font-weight:700;opacity:0;transform:translate(50%,16px);transition:.25s}.toast.show{opacity:1;transform:translate(50%,0)}@keyframes shine{0%,28%{transform:translateX(-55%) rotate(12deg)}68%,100%{transform:translateX(55%) rotate(12deg)}}@keyframes glow{50%{box-shadow:0 0 0 8px #d6b66a1a,0 0 43px #d6b66a66}}@media(max-width:760px){.projects{grid-template-columns:1fr;max-width:500px;margin:auto}.project-image{height:215px}.section{margin-top:42px}}@media(max-width:390px){body{padding-inline:12px}.card{padding:29px 17px 22px}.contact{gap:7px}.action{min-height:68px}.action span{font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head>
<body><main class="page">
<section class="card" id="card" aria-label="بطاقة مصطفى صقر"><span class="eyebrow">بطاقة أعمال VIP</span><div class="avatar"><div class="avatar-inner" id="avatar"></div></div><h1 id="name"></h1><p class="title" id="title"></p><span class="company" id="company"></span><p class="bio" id="bio"></p>
<button class="btn primary" id="saveBtn" type="button">↓ حفظ جهة الاتصال</button>
<nav class="contact" aria-label="التواصل السريع"><a class="action" id="callBtn" href="#"><svg viewBox="0 0 24 24"><path d="M21 16.5v3a2 2 0 0 1-2 2A19 19 0 0 1 4 6a2 2 0 0 1 2-2h3l1 5-2 2a16 16 0 0 0 5 5l2-2 5 1z"/></svg><span>اتصال</span></a><a class="action" id="waBtn" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.7A8.5 8.5 0 1 1 20.5 11.5Z"/><path d="M8 8c1-1 1.5 2 3 3.5S15 13 14 14c-1 1-5-1-6-4z"/></svg><span>واتساب</span></a><a class="action" id="mailBtn" href="#"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg><span>بريد</span></a><a class="action" id="mapBtn" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>الموقع</span></a></nav>
<a class="btn share" id="shareBtn" href="#" role="button">↗ مشاركة الكارت</a><div class="socials" id="socials"></div><div class="info"><p>⌖ <span id="addrTxt"></span></p><p>☎ <span class="ltr" id="phoneTxt"></span></p><p>✉ <span class="ltr" id="emailTxt"></span></p></div></section>
<section class="section"><h2>نماذج حية من أعمالي</h2><p class="lead">تجارب رقمية راقية تساعد المطاعم والوجهات على بناء ولاء يدوم.</p><div class="projects" id="projects"></div></section></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const CONFIG={name:"مصطفى صقر",title:"مطور أنظمة الولاء الذكية والحلول الرقمية للمطاعم والكافيهات",company:"EST",bio:"أساعد المطاعم والكافيهات على تحويل عملائها إلى زوار دائمين عبر كروت VIP ذكية وتجارب رقمية أنيقة تزيد التفاعل والمبيعات وتُبقي علامتكم في الذاكرة.",phone:"+201275646204",whatsapp:"201275646204",email:"example@email.com",address:"القاهرة، مصر",website:"https://example.com",avatarUrl:"photo.jpg",social:{facebook:"https://facebook.com/",instagram:"https://instagram.com/",linkedin:"https://linkedin.com/",youtube:"https://youtube.com/"},projects:[
{name:"مشروع قرية البادية (Badia Village)",description:"نظام كارت VIP رقمي ومنيو تفاعلي يقدّم تجربة ضيافة عصرية لضيوف القرية.",image:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1000&q=85",demoUrl:"https://mostafadoctor1999-create.github.io/vip-card/"},
{name:"مشروع منتجع الخيمة (Al-Khayma Resort)",description:"تجربة حجز ذكية وبطاقة عضوية فاخرة تربط الزائر بخدمات المنتجع.",image:"https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=1000&q=85",demoUrl:"https://mustafasakr199939-lang.github.io/alkhaymah-Vip/"},
{name:"نموذج كافيهات VIP (Interactive Demo)",description:"نموذج مرن جاهز للتخصيص وإضافة مشروع جديد أو استعراض تجربة الولاء للكافيهات.",image:"https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1000&q=85",demoUrl:"#"},
{name:"Tatinak VIP · واجهة الكاشير",description:"معاينة حية لتجربة الكاشير ضمن منصة Tatinak VIP التفاعلية.",image:"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1000&q=85",demoUrl:"https://tatinak-vip.vercel.app/?view=cashier"}]};
const ICONS={facebook:'<svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',instagram:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/></svg>',linkedin:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 10v7M11 17v-4a2 2 0 0 1 4 0v4"/></svg>',youtube:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></svg>'},$=id=>document.getElementById(id);
function render(){for(const key of ["name","title","company","bio"])$(key).textContent=CONFIG[key];$("addrTxt").textContent=CONFIG.address;$("phoneTxt").textContent=CONFIG.phone;$("emailTxt").textContent=CONFIG.email;const av=$("avatar");if(CONFIG.avatarUrl){const img=document.createElement("img");img.src=CONFIG.avatarUrl;img.alt=CONFIG.name;img.onerror=()=>{img.remove();av.textContent="مص"};av.append(img)}else av.textContent="مص";$("callBtn").href=`tel:${CONFIG.phone}`;$("waBtn").href=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("مرحباً، تواصلت معك من الكارت الرقمي")}`;$("mailBtn").href=`mailto:${CONFIG.email}`;$("mapBtn").href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CONFIG.address)}`;Object.entries(CONFIG.social).forEach(([name,url])=>{if(!url||url==="#")return;const a=document.createElement("a");a.className="social";a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.setAttribute("aria-label",name);a.innerHTML=ICONS[name]||"";$("socials").append(a)});CONFIG.projects.forEach((p,i)=>{const article=document.createElement("article");article.className="project";const active=p.demoUrl!=="#";article.innerHTML=`<div class="project-image"><img src="${p.image}" alt="معاينة المشروع" loading="lazy"></div><div class="project-content"><span class="kicker">مشروع ${String(i+1).padStart(2,"0")}</span><h3></h3><p></p><a class="btn demo" ${active?`href="${p.demoUrl}" target="_blank" rel="noopener noreferrer"`:'href="#" aria-disabled="true"'}>معاينة حية · Live Demo</a>${active?"":'<small class="note">أضف رابط المعاينة لتفعيل المشروع.</small>'}</div>`;article.querySelector("h3").textContent=p.name;article.querySelector("p").textContent=p.description;if(!active)article.querySelector(".demo").onclick=e=>{e.preventDefault();toast("أضف رابط المعاينة في إعدادات المشروع")};$("projects").append(article)});$("saveBtn").onclick=saveContact;$("shareBtn").onclick=shareCard;tilt()}
function tilt(){const c=$("card");c.onpointermove=e=>{if(e.pointerType==="mouse"&&e.buttons!==0)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty("--ry",`${(x-.5)*7}deg`);c.style.setProperty("--rx",`${(.5-y)*7}deg`);c.style.setProperty("--sx",`${x*100}%`);c.style.setProperty("--sy",`${y*100}%`)};c.onpointerleave=()=>{c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}}
function qp(s){let out="",line="";for(const b of new TextEncoder().encode(s)){const ch=b>=33&&b<=126&&b!==61?String.fromCharCode(b):b===32?" ":"="+b.toString(16).toUpperCase().padStart(2,"0");if(line.length+ch.length>75){out+=line+"=\r\n";line=""}line+=ch}return out+line}function vcard(){return ["BEGIN:VCARD","VERSION:3.0",`FN;CHARSET=UTF-8;ENCODING=QUOTED-PRINTABLE:${qp(CONFIG.name)}`,`TITLE;CHARSET=UTF-8;ENCODING=QUOTED-PRINTABLE:${qp(CONFIG.title)}`,`ORG:${CONFIG.company}`,`TEL;TYPE=CELL:${CONFIG.phone}`,`EMAIL:${CONFIG.email}`,`ADR;TYPE=WORK:;;${qp(CONFIG.address)};;;;`,`URL:${CONFIG.website}`,"END:VCARD"].join("\r\n")}function saveContact(){const url=URL.createObjectURL(new Blob([vcard()],{type:"text/vcard;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="mostafa-sakr.vcf";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("تم تجهيز ملف جهة الاتصال ✅")}async function shareCard(e){e.preventDefault();try{if(navigator.share)await navigator.share({title:CONFIG.name,text:`${CONFIG.name} - ${CONFIG.title}`,url:location.href});else await navigator.clipboard.writeText(location.href)}catch(err){if(err.name==="AbortError")return;const t=document.createElement("textarea");t.value=location.href;document.body.append(t);t.select();document.execCommand("copy");t.remove()}toast("تم نسخ رابط الكارت 📋")}let timer;function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>t.classList.remove("show"),2500)}render();
</script></body></html>
